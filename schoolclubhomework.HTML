<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- STEP 1 - Bootstrap CSS link -->
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background-color: #799efc;
      font-family: 'Times New Roman', Times, serif;
      padding: 25px 10px;
    }
    h1 {
      text-align: center;
      color: #03f9a3;
    }
    .club-card {
      text-align: center;
      border: 4px solid #1702ff;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 25px;
      background-color: #f278e8;
    }
    .club-card h3 {
      color: #9e2cf6;
    }
  </style>
</head>
<body>

  <h1>School Clubs</h1>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>sleeping Club</h3>
          <p>sleep brfore you go home or to your next class to be energysed</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>chess Club</h3>
          <p>learn to play and rost people playing. if you like doing that then stuff then join </p>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Art Club</h3>
          <p> love drawing, painting, and creating colourful designs then this clube is for you.</p>
        </div>
      </div>

    </div>
  </div>

  <!-- STEP 5 - Bootstrap JS script -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>
</html>
